[Settings]
Develop=0
Console=1
EnableJit=1
PatchGameAssemblies=1

; Diagnostic switch, leave empty for normal use.
; Comma separated bundled assembly names to leave exactly as the game shipped them instead of pointing Mono at
; our Overrides copy. The mod is compiled against the override versions, so skipping one will usually raise a
; managed TypeLoad or MissingMethod exception; that is still informative, because a clean managed exception
; where there used to be a native crash tells us the replacement is what the crash depends on.
;   SkipBundleReplacement=LiteNetLib
SkipBundleReplacement=

; Diagnostic switch, leave at 1 for normal use.
; 0 stops the crash handler writing a report or minidump from a first chance fault; the exception ring is still
; recorded, and the unhandled filter still reports. Use it to check whether our own reporting is what stops the
; process, rather than the fault itself.
CrashHandlerEscalate=1
